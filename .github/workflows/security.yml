# Pipeline DevSecOps : bloque la fusion/le déploiement si un contrôle de sécurité échoue.
name: security
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'     # audit hebdomadaire (nouvelles vulnérabilités connues)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntaxe PHP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'pdo_sqlite, mbstring, openssl, dom, fileinfo, zip, gd' }
      - run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l | grep -v '^No syntax errors' || true
          ! find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l 2>&1 | grep -q 'Parse error'

  secrets:
    name: "Secrets (Gitleaks, historique complet)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        run: |
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  sast:
    name: "Analyse statique (Semgrep)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install semgrep==1.183.0
      - name: "Semgrep (OWASP Top 10, PHP, audit de sécurité) — échoue sur toute alerte"
        run: semgrep scan --config p/php --config p/owasp-top-ten --config p/security-audit --metrics=off --error --exclude tests _app tools index.php assets/js

  deps:
    name: "Dépendances, configuration et secrets (Trivy, non bloquant)"
    runs-on: ubuntu-24.04
    continue-on-error: true      # à rendre bloquant dès qu'un premier passage réussi est vérifié
    steps:
      - uses: actions/checkout@v4
      - name: Trivy (image officielle, version figée)
        run: docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.58.1 fs --scanners vuln,secret,misconfig --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 /src

  security-tests:
    name: "Tests de sécurité (119 scénarios d'attaque sur instance isolée)"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'pdo_sqlite, mbstring, openssl, dom, fileinfo, zip, gd', ini-values: 'upload_max_filesize=64M, post_max_size=64M' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: bash tests/security/run.sh "$GITHUB_WORKSPACE" 8090 ci
        env:
          SECURITY_OUT: ${{ runner.temp }}
      - name: "Tests unitaires (SMTP, journal chaîné, TOTP RFC 6238, mots de passe fuités)"
        run: node tests/security/unit.js
      - name: "Migrations réversibles (up, down, ré-up)"
        run: php tests/platform/migrations.php
      - name: "Tests fonctionnels de la plateforme (invités, devis, notifications, fichiers, catalogue)"
        run: bash tests/platform/run.sh 8100
        env:
          SECURITY_OUT: ${{ runner.temp }}
      - name: "Interrupteurs de fonctionnalités (59 scénarios : chaque famille et module, accès directs, API, contournements, données préservées, notifications, base indisponible)"
        run: bash tests/features/run.sh 8300
        env:
          SECURITY_OUT: ${{ runner.temp }}
      - name: "Chemin de mise à jour (ancienne base vers nouveau code)"
        run: bash tests/security/upgrade.sh a200885 8096
        env:
          SECURITY_OUT: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-tests-securite
          path: ${{ runner.temp }}/results-ci.json

  platform-mysql:
    name: "Tests de la plateforme sur MariaDB (même famille que le MySQL de la production)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: mariadb:10.11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: symo_ci }
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=24
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'pdo_mysql, pdo_sqlite, mbstring, openssl, dom, fileinfo, zip, gd', ini-values: 'upload_max_filesize=64M, post_max_size=64M' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: "Configuration de test (base MariaDB jetable)"
        run: |
          printf '%s\n' '<?php return ["db" => ["driver" => "mysql", "host" => "127.0.0.1", "name" => "symo_ci", "user" => "root", "pass" => "root"], "auto_install" => true];' > "$RUNNER_TEMP/mysql.config.php"
      - name: "Tests fonctionnels de la plateforme sur MariaDB (clés, longueurs de colonnes, SQL propre à MySQL)"
        run: bash tests/platform/run.sh 8100
        env:
          SECURITY_OUT: ${{ runner.temp }}
          SYMO_CONFIG: ${{ runner.temp }}/mysql.config.php
      - name: "Interrupteurs de fonctionnalités sur MariaDB"
        run: bash tests/features/run.sh 8300
        env:
          SECURITY_OUT: ${{ runner.temp }}
          FEATURES_DB_CONFIG: ${{ runner.temp }}/mysql.config.php

  gate:
    name: Porte de déploiement
    needs: [lint, secrets, sast, security-tests, platform-mysql]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Tous les contrôles de sécurité sont passés, le déploiement est autorisé."
