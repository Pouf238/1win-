<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(/fonts/bricolage-grotesque-latin-wght-normal.woff2);font-weight:200 800}
@font-face{font-family:I;src:url(/fonts/inter-latin-wght-normal.woff2);font-weight:100 900}
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:#10151C;color:#fff;font-family:I;position:relative;overflow:hidden}
.c{position:absolute;border-radius:50%;mix-blend-mode:screen}

h1{font-family:B;font-weight:800;font-size:76px;line-height:.98;letter-spacing:-.04em;margin:0 0 28px}
h1 span{background:linear-gradient(transparent 62%,#FFC400 62% 92%,transparent 92%);color:#fff;padding:0 6px;margin:0 -6px}
